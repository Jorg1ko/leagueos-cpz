name: Publicar LeagueOS en Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: leagueos-pages-production
  cancel-in-progress: true

jobs:
  publicar:
    name: Publicar web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar archivos estáticos
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp player.html dist/player.html
          cp legal.html dist/legal.html
          cp admin.css dist/admin.css
          cp admin.js dist/admin.js

      # Pages Functions debe estar en la raíz del repositorio, junto a dist/.
      # Wrangler la compila y la despliega automáticamente desde este directorio.
      - name: Validar archivos y funciones
        run: |
          test -f dist/index.html
          test -f dist/admin.js
          test -f functions/_middleware.js
          test -f functions/api/accounts.js
          test -f functions/api/results.js
          node --check dist/admin.js
          find functions -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91f1c143e0758ef69970b4d75629f605
          command: pages deploy dist --project-name=leagueos-cpz --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
