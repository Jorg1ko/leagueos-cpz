name: Publicar LeagueOS en Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: leagueos-pages-production
  cancel-in-progress: true

jobs:
  comprobar:
    name: Validar código sin publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JavaScript y estructura
        run: |
          test -f index.html
          test -f player.html
          test -f admin.css
          test -f admin.js
          test -f ranking-engine.js
          test -f functions/api/doubles-results.js
          test -f cpz-escudo.svg
          test -f functions/_middleware.js
          test -f functions/api/accounts.js
          test -f functions/api/results.js
          node --check admin.js
          node --check ranking-engine.js
          node tests/ranking-engine.test.cjs
          node -e 'const fs=require("fs"),vm=require("vm"); for(const file of ["player.html","index.html"]){const src=fs.readFileSync(file,"utf8");const re=/<script\b[^>]*>([\s\S]*?)<\/script>/gi;let m;while((m=re.exec(src))) if(m[1].trim())new vm.Script(m[1],{filename:file});}'
          find functions -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const j=fs.readFileSync('admin.js','utf8');if(!h.includes('page-groups')||!j.includes('renderGroups'))process.exit(1)"
  publicar:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: comprobar
    name: Publicar web
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar archivos estáticos
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp player.html dist/player.html
          cp legal.html dist/legal.html
          cp admin.css dist/admin.css
          cp admin.js dist/admin.js
          cp ranking-engine.js dist/ranking-engine.js
          cp cpz-escudo.svg dist/cpz-escudo.svg

      # Pages Functions debe estar en la raíz del repositorio, junto a dist/.
      # Wrangler la compila y la despliega automáticamente desde este directorio.
      - name: Validar archivos y funciones
        run: |
          test -f dist/index.html
          test -f dist/admin.js
          test -f functions/_middleware.js
          test -f functions/api/accounts.js
          test -f functions/api/results.js
          node --check dist/admin.js
          node --check dist/ranking-engine.js
          find functions -type f -name '*.js' -print0 | xargs -0 -n 1 node --check

      - name: Subir a Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 91f1c143e0758ef69970b4d75629f605
          command: pages deploy dist --project-name=leagueos-cpz --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
