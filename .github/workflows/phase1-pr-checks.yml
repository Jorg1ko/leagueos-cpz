name: Validación fase 1 (sin desplegar ni acceder a D1)
on:
  pull_request:
    branches:
      - experimental/laboratorio-cpz
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Node 22 para SQLite temporal en memoria
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar scripts de aplicación
        shell: bash
        run: |
          set -euo pipefail
          node --version
          find functions -type f -name '*.js' -print0 | xargs -0 -n 1 node --check
          for file in ./*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import ast
          for path in Path('scripts').glob('*.py'):
              ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
              print('Sintaxis OK:',path)
          PY
      - name: Ejecutar TODOS los tests sobre datos sintéticos locales
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for test in tests/*.cjs tests/*.mjs tests/*.js; do
            echo "TEST: $test"
            node "$test"
          done
      - name: Comprobar JS incrustado y migración inofensiva
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          for(const path of ['index.html','player.html','club-portal.html','lab-preview.html','legal.html']){
            const source=fs.readFileSync(path,'utf8');
            const re=/<script\b[^>]*>([\s\S]*?)<\/script>/gi;
            let match;while((match=re.exec(source)))if(match[1].trim())new vm.Script(match[1],{filename:path});
          }
          console.log('JavaScript inline validado');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('migrations/2026-11-22_soft_delete_audit.sql').read_text()
          body='\n'.join(x for x in sql.splitlines() if not x.strip().startswith('--')).upper()
          assert 'DROP TABLE' not in body and 'DELETE FROM' not in body
          assert body.count('ADD COLUMN DELETED_AT')==2
          print('Migración comprobada: solo columnas nuevas y tabla de auditoría')
          PY

  inspeccion_d1_puntual:
    name: Inspección puntual D1 (SELECT, sin datos personales)
    needs: pruebas
    # Solo para el PR autorizado desde este mismo repositorio.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
    steps:
      - name: Consultar esquema y recuentos reales sin modificaciones
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          token=os.environ.get('CF_TOKEN','')
          if not token:
              raise SystemExit('NO VERIFICADO: el secreto existente D1 de solo lectura no está disponible en este PR.')
          # IDs públicos del proyecto, nunca credenciales.
          endpoint='https://api.cloudflare.com/client/v4/accounts/91f1c143e0758ef69970b4d75629f605/d1/database/34356bf4-507b-4cc8-8de0-aca736e23cf9/query'
          tables=('cpz_match_results','cpz_doubles_results')
          def query(sql):
              if not re.match(r'^\\s*SELECT\\b',sql,re.I):
                  raise SystemExit('Bloqueado: únicamente SELECT.')
              req=urllib.request.Request(endpoint,
                  data=json.dumps({'sql':sql}).encode('utf-8'),
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
                  method='POST')
              try:
                  with urllib.request.urlopen(req,timeout=25) as res:
                      data=json.load(res)
              except urllib.error.HTTPError as err:
                  raise SystemExit('No se pudo comprobar D1 con permiso de lectura: HTTP '+str(err.code)) from None
              if not data.get('success') or not data.get('result') or not data['result'][0].get('success'):
                  raise SystemExit('D1 rechazó la consulta SELECT; esquema no verificado')
              return data['result'][0].get('results',[])
          for table in tables:
              metadata=query("SELECT name,type,tbl_name,sql FROM sqlite_schema WHERE (name='"+table+"' OR tbl_name='"+table+"') AND type IN ('table','index') ORDER BY type,name")
              if not any(x.get('name')==table and x.get('type')=='table' for x in metadata):
                  raise SystemExit('La tabla '+table+' no existe o no es visible.')
              print('ESQUEMA REAL',table,json.dumps(metadata,ensure_ascii=False))
              count=query('SELECT COUNT(*) AS total FROM '+table)
              if len(count)!=1 or not isinstance(count[0].get('total'),int):
                  raise SystemExit('No se pudo comprobar el número de resultados de '+table)
              print('RECUENTO REAL',table,count[0]['total'])
          print('VERIFICACIÓN SOLO LECTURA: completada mediante SELECT. Sin exportación ni mutaciones.')
          PY
