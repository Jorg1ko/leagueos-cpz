name: Copia D1 nocturna cifrada · pendiente de autorización
on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpz-d1-backup-encrypted
  cancel-in-progress: false
jobs:
  copia:
    # Seguridad: jamás operar sobre D1 sin autorización manual
    # mediante la variable de repositorio, aunque se active el schedule.
    if: vars.CPZ_D1_BACKUP_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      AGE_RECIPIENT: ${{ secrets.D1_BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Obtener código del repo sin desplegar
        uses: actions/checkout@v4
      - name: Validar configuración para cifrar antes de descargar
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CF_BACKUP_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_D1_BACKUP_TOKEN. La base NO se ha consultado."
            exit 1
          fi
          if [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::Falta D1_BACKUP_AGE_RECIPIENT. No se permite descargar una copia sin cifra."
            exit 1
          fi
          if [[ "$AGE_RECIPIENT" != age1* ]]; then
            echo "::error::Destinatario de cifrado age no válido."
            exit 1
          fi
      - name: Preparar cifrado age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          age --version
      - name: Exportar SQL sin ejecutar modificaciones
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export-d1-backup.py
      - name: Cifrar y verificar que existe un archivo cifrado
        shell: bash
        run: |
          set -euo pipefail
          age -r "$AGE_RECIPIENT" -o cpz-d1-export.sql.age cpz-d1-export.sql
          test -s cpz-d1-export.sql.age
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cpz-d1-export.sql.age')
          if p.stat().st_size<200:
              raise SystemExit('::error::La copia cifrada está vacía: no se publicará')
          if not p.read_bytes().startswith(b'age-encryption.org/v1'):
              raise SystemExit('::error::El artefacto no parece cifrado con age')
          print('Copia cifrada comprobada; tamaño bytes:',p.stat().st_size)
          PY
          # Los datos en claro jamás se almacenan como artefacto.
          rm -f cpz-d1-export.sql
      - name: Guardar solo la copia cifrada durante 14 días
        uses: actions/upload-artifact@v4
        with:
          name: cpz-d1-cifrada-${{ github.run_id }}-${{ github.run_attempt }}
          path: cpz-d1-export.sql.age
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Confirmar éxito
        run: |
          echo "Copia D1 cifrada y validada, guardada 14 días como artefacto privado en su contenido." >> "$GITHUB_STEP_SUMMARY"
