name: Diagnostico token D1 sin exportacion - temporal
on:
  pull_request:
    types: [synchronize]
    branches: [experimental/laboratorio-cpz]
permissions:
  contents: read
jobs:
  verificar_token:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 34 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1/proteccion-datos-reversible-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
    steps:
      - name: Fijar revision autorizada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verificar que esta ejecucion es solo diagnostico
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ops(phase1): verify D1 backup token without export 2026-11-22'
      - name: Comprobar la validez del token y acceso de lectura a la base
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          token=os.environ.get('CF_BACKUP_TOKEN','')
          if not token: raise SystemExit('El secreto de backup no esta configurado; no se han realizado llamadas.')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          account='91f1c143e0758ef69970b4d75629f605'
          database='34356bf4-507b-4cc8-8de0-aca736e23cf9'
          probes=[
            ('Verificacion token de usuario','https://api.cloudflare.com/client/v4/user/tokens/verify'),
            ('Verificacion token de cuenta','https://api.cloudflare.com/client/v4/accounts/'+account+'/tokens/verify'),
            ('Acceso GET a base D1 (sin SQL)','https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database),
          ]
          for label,url in probes:
            req=urllib.request.Request(url,headers=headers,method='GET')
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                http=resp.status
                data=json.load(resp)
            except urllib.error.HTTPError as error:
              http=error.code
              try: data=json.load(error)
              except Exception: data={}
            except Exception:
              print(label+': error de conexion; ningun dato divulgado')
              continue
            success=bool(data.get('success')) if isinstance(data,dict) else False
            token_status=(data.get('result') or {}).get('status') if isinstance(data,dict) else None
            codes=[str(item.get('code')) for item in data.get('errors',[]) if isinstance(item,dict) and item.get('code') is not None] if isinstance(data,dict) else []
            print(label+': HTTP',http,'success='+str(success),'token_status='+str(token_status) if token_status else '',
                  'error_codes='+(','.join(codes) if codes else '-'))
          print('Diagnostico finalizado; sin exportar, sin modificar D1, sin registrar el token.')
          PY
