name: Verificacion puntual de token D1 - sin exportar
on:
  pull_request:
    types: [synchronize]
    branches: [experimental/laboratorio-cpz]
permissions:
  contents: read
jobs:
  diagnostico:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 34 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase1/proteccion-datos-reversible-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Obtener revision concreta
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Autorizar exclusivamente esta comprobacion puntual
        shell: bash
        run: |
          set -euo pipefail
          test "$(git log -1 --format=%s)" = 'ops(phase1): verify corrected backup token safely 2026-11-23'
      - name: Verificar credencial Cloudflare con GET (sin exportar ni SQL)
        shell: bash
        env:
          CF_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ.get('CF_BACKUP_TOKEN','').strip()
          if not token: raise SystemExit('RESULTADO: secreto ausente o vacio; no se accedio a D1.')
          if token.startswith('Bearer '): raise SystemExit('RESULTADO: el secreto incluye Bearer por error.')
          headers={'Authorization':'Bearer '+token,'Accept':'application/json'}
          targets=[
            ('Token','https://api.cloudflare.com/client/v4/user/tokens/verify'),
            ('D1 metadata','https://api.cloudflare.com/client/v4/accounts/91f1c143e0758ef69970b4d75629f605/d1/database/34356bf4-507b-4cc8-8de0-aca736e23cf9')
          ]
          ok=True
          for label,url in targets:
            request=urllib.request.Request(url,headers=headers,method='GET')
            try:
              with urllib.request.urlopen(request,timeout=20) as response:
                status=response.status
                body=json.load(response)
            except urllib.error.HTTPError as error:
              status=error.code
              try: body=json.load(error)
              except Exception: body={}
            except Exception:
              print(label+': error de conexion, sin acceso ni modificaciones')
              ok=False
              continue
            success=body.get('success') is True if isinstance(body,dict) else False
            error_codes=[str(x['code']) for x in body.get('errors',[]) if isinstance(x,dict) and 'code' in x] if isinstance(body,dict) else []
            print(label+': HTTP '+str(status)+', OK='+str(success)+', errores='+(','.join(error_codes) if error_codes else '-'))
            if status!=200 or not success: ok=False
          print('Solo peticiones GET; no se ha exportado ni modificado D1.')
          if not ok: raise SystemExit('RESULTADO: comprobar configuracion del token.')
          print('RESULTADO: token valido y acceso a metadatos D1 confirmado.')
          PY
